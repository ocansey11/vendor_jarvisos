plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            // Android stubs (Log, Context, WorkManager etc) — just enough to compile
            srcDirs = ['stubs']
        }
    }
    test {
        java {
            srcDirs = [
                '../../../frameworks/base/services/jarvis/java',
                '../apps/JarvisTicTacToe/src',
                'src/test/java'
            ]
            // Only compile the files the agent tests actually need.
            // JarvisService, FileObserver, ToolScannerService etc. are excluded —
            // they depend on Android framework classes we'd need to stub exhaustively.
            include 'com/android/server/jarvis/agent/**'
            include 'com/android/server/jarvis/model/**'
            include 'com/android/server/jarvis/inference/**'
            include 'com/android/server/jarvis/core/JarvisStore.java'
            include 'com/android/server/jarvis/core/ModelRegistry.java'
            include 'com/android/server/jarvis/search/MetadataSearch.java'
            include 'com/android/server/jarvis/tools/ToolDispatcher.java'
            include 'com/android/server/jarvis/tools/AppRecord.java'
            include 'com/android/server/jarvis/tools/ToolRecord.java'
            include 'com/android/server/jarvis/tools/AppRecord_.java'
            include 'com/android/server/jarvis/tools/ToolRecord_.java'
            include 'com/android/server/jarvis/tools/AppRecordCursor.java'
            include 'com/android/server/jarvis/tools/ToolRecordCursor.java'
            include 'com/android/server/jarvis/core/MyObjectBox.java'
            include 'com/android/server/jarvis/core/JarvisScheduler.java'
            // Sessions (AX): the parts with no Android in them.
            include 'com/android/server/jarvis/session/SessionManifest.java'
            include 'com/android/server/jarvis/session/SessionPrompt.java'
            include 'com/android/server/jarvis/session/SessionTools.java'
            include 'com/android/server/jarvis/session/SessionTurn.java'
            include 'com/android/server/jarvis/session/EventLimiter.java'
            include 'com/android/server/jarvis/session/*Test.java'
            // The sample game's rules and move evaluation (apps/JarvisTicTacToe).
            include 'com/jarvisos/tictactoe/Board.java'
            include 'com/jarvisos/tictactoe/**Test.java'
        }
    }
}

dependencies {
    // JSON — used throughout JarvisOS source
    implementation 'org.json:json:20240303'

    // ObjectBox Java API — annotations + Box/Query interfaces (no native runtime needed)
    implementation 'io.objectbox:objectbox-java:4.0.3'

    // XmlPullParser for SessionManifest, from the tree's prebuilts (no download)
    testImplementation files('../../../prebuilts/misc/common/kxml2/kxml2-2.3.0.jar')

    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly  'org.junit.platform:junit-platform-launcher'

    // Mockito 5 — includes static mocking (for CactusWrapper, JarvisStore)
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
}

test {
    useJUnitPlatform()
    // Print each test name as it runs
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
